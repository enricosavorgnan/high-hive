name: CI/CD Docker Build Validation

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and Test Container
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: false # Set to true only if configuring a Docker registry
          tags: hive-bot:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max